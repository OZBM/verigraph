[package]
name = "vg-core"
description = "Data model, VG-Sym parser and printer, .vgir codec, canonicalizer, BLAKE3 hashing, validator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The seeded program generator of docs/16 (P1.11), for property, differential and fuzz tests.
gen = []

[dependencies]
blake3 = "1"

[dev-dependencies]
# The integration tests use the generator.
vg-core = { path = ".", features = ["gen"] }
