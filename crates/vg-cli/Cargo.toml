[package]
name = "vg-cli"
description = "The vg command, plus vg mcp, an MCP server any AI agent can call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vg"
path = "src/main.rs"

[features]
# Research track R-13: `vg lift --lang python`.
r-13 = ["vg-omnilift/r-13"]

[dependencies]
vg-core = { path = "../vg-core" }
vg-store = { path = "../vg-store" }
vg-types = { path = "../vg-types" }
vg-interp = { path = "../vg-interp" }
vg-smt = { path = "../vg-smt" }
vg-codegen = { path = "../vg-codegen" }
vg-rt = { path = "../vg-rt" }
vg-decode = { path = "../vg-decode" }
vg-telemetry = { path = "../vg-telemetry" }
vg-mesh = { path = "../vg-mesh" }
# The project's Mesh signing key (already in the lock through vg-mesh).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
vg-omnilift = { path = "../vg-omnilift" }
serde_json = "1"
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt"] }
blake3 = "1"

[dev-dependencies]
# The differential tests draw programs from the generator (docs/16).
vg-core = { path = "../vg-core", features = ["gen"] }
