[package]
name = "vg-store"
description = "Content-addressed object store and index, like .git/objects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vg-core = { path = "../vg-core" }
# SQLite, compiled in, so every host indexes with the same version.
rusqlite = { version = "0.37", features = ["bundled"] }
