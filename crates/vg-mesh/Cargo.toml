[package]
name = "vg-mesh"
description = "Registry: store, index, query, ingestion gate, HTTP API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vg-core = { path = "../vg-core" }
vg-store = { path = "../vg-store" }
vg-types = { path = "../vg-types" }
vg-smt = { path = "../vg-smt" }
# JSON for the HTTP API, queries and C2SP signed notes.
serde_json = "1"
# Ed25519 signatures for attestations and log checkpoints (docs/09, c2sp.org/signed-note).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# SHA-256 for the RFC 6962 Merkle log, as c2sp.org/tlog-tiles requires.
sha2 = "0.11"
rusqlite = { version = "0.37", features = ["bundled"] }
