name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-x86_64
            os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            z3: z3-5.4.1-x64-glibc-2.39.zip
            z3_sha256: b548bac48ef2452b4e09ea2945cf4b011d5f43fcf39e4799df268ee7e0769d85
          - name: macos-arm64
            # Apple clang 21 (Xcode 26.6) has the wasm32 target that vg-codegen's tests build for;
            # Xcode 16.4's clang, the default on macos-15, does not.
            os: macos-26
            triple: aarch64-apple-darwin
            z3: z3-5.4.1-arm64-osx-13.3.zip
            z3_sha256: a4a878121e81dfc297d027dd0b51dc4f08feb4296d6ecace42bfbc87a29d6d58
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - name: Install z3 5.4.1, the version in toolchain.lock
        run: |
          curl -fsSL -o "$RUNNER_TEMP/z3.zip" "https://github.com/Z3Prover/z3/releases/download/z3-5.4.1/${{ matrix.z3 }}"
          echo "${{ matrix.z3_sha256 }}  $RUNNER_TEMP/z3.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/z3.zip" -d "$RUNNER_TEMP/z3"
          bin="$(dirname "$(find "$RUNNER_TEMP/z3" -type f -name z3 | head -n 1)")"
          "$bin/z3" --version
          echo "$bin" >> "$GITHUB_PATH"
      - name: Confirm the host architecture
        run: rustc -vV | grep -Fx "host: ${{ matrix.triple }}"
      - name: Confirm that clang has the wasm32 target
        if: runner.os == 'macOS'
        run: |
          clang --version | head -n 1
          clang -print-targets | grep -q wasm32 || { echo "this clang has no wasm32 target"; exit 1; }
      - name: Test the Antigravity extension
        run: node --test editors/antigravity/extension/test/*.test.js
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
